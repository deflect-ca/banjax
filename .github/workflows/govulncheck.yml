on:
  push:
  pull_request:
  # New advisories are published without any code change, so also scan weekly.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
name: Govulncheck
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    # Use the exact toolchain pinned in go.mod so stdlib findings match what we ship.
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest
    - name: Run govulncheck
      run: govulncheck ./...
