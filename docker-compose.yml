version: '3.4'

services:
  banjax:
    build:
      context: ./
      dockerfile: Dockerfile
    # this uses the nginx network namespace so it can set iptables rules
    # in the right place. the go app listens on port 8081
    network_mode: "service:nginx"
    cap_add:
      - NET_ADMIN  # we use iptables for banning
    volumes:
      - ./logs/banjax:/var/log/banjax/
      - .:/opt/banjax/
    restart: on-failure:5
    env_file: ".env"

  nginx:
    build:
      context: ./supporting-containers/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "8001:8001"
    volumes:
      - ./logs/banjax:/var/log/banjax/
      - ./supporting-containers/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./logs/nginx:/var/log/nginx/

  test-origin:
    build:
      context: ./supporting-containers/test-origin
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  # Local-only test runner for POST/PUT/DELETE handling. The "tools" profile
  # keeps it out of `docker compose up`; run it on demand with
  #   docker compose run --rm local-tester
  local-tester:
    profiles:
      - tools
    image: local-tester
    build:
      context: ./supporting-containers/local-tester
      dockerfile: Dockerfile
    depends_on:
      - nginx
      - test-origin

  # Deflect Challenge verifier: proves cryptographically that the edge really is
  # Deflect. Also in the "tools" profile; run it with
  #   docker compose run --rm challenge-client
  challenge-client:
    profiles:
      - tools
    image: challenge-client
    build:
      context: ./supporting-containers/challenge-client
      dockerfile: Dockerfile
    depends_on:
      - nginx

  # One-off tool for sending a simulated banjax kafka command message, to
  # exercise block_ip/challenge_ip/block_session/challenge_session/challenge_all
  # without needing baskerville. Run with, e.g.:
  #   docker compose run --rm kafka-cmd-tester -cmd challenge_all -host localhost
  # Built from the repo root context so it can share the main go.mod/go.sum.
  kafka-cmd-tester:
    profiles:
      - tools
    image: kafka-cmd-tester
    build:
      context: ./
      dockerfile: supporting-containers/kafka-cmd-tester/Dockerfile
    volumes:
      - ./keys:/etc/banjax:ro
    env_file: ".env"
    environment:
      - KAFKA_TOPIC=banjax_command_topic_dev
