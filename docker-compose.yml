version: '3.4'

services:
  banjax:
    build:
      context: ./
      dockerfile: Dockerfile
    # this uses the nginx network namespace so it can set iptables rules
    # in the right place. the go app listens on port 8081
    network_mode: "service:nginx"
    cap_add:
      - NET_ADMIN  # we use iptables for banning
    volumes:
      - ./logs/banjax:/var/log/banjax/
      - .:/opt/banjax/
    restart: on-failure:5
    env_file: ".env"

  nginx:
    build:
      context: ./supporting-containers/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "8001:8001"
    volumes:
      - ./logs/banjax:/var/log/banjax/
      - ./supporting-containers/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./logs/nginx:/var/log/nginx/

  test-origin:
    build:
      context: ./supporting-containers/test-origin
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  # Local-only test runner for POST/PUT/DELETE handling. The "tools" profile
  # keeps it out of `docker compose up`; run it on demand with
  #   docker compose run --rm local-tester
  local-tester:
    profiles:
      - tools
    image: local-tester
    build:
      context: ./supporting-containers/local-tester
      dockerfile: Dockerfile
    depends_on:
      - nginx
      - test-origin
