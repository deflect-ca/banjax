<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying if your connection is secure...</title>
    <!--
        ALTCHA widget (https://altcha.org, MIT), pinned to an exact version. The integrity hash
        makes the browser refuse the file if the CDN ever serves different bytes; update both
        together, from the npm tarball's dist/main/altcha.min.js.
    -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/altcha@3.5.0/dist/main/altcha.min.js"
            integrity="sha384-gOM06hLiIE9gqqwEjEvV5X4Qyh1QORVxybHDsnL86ardcb2AyiJHwkEbG+p1agCJ" crossorigin="anonymous"></script>
    <script type="text/javascript">
        'use strict';

        /**
        *
        *  Base64 encode / decode
        *  http://www.webtoolkit.info/
        *
        **/

        // Localized dead-end message shown when we cannot solve (the widget failed to load,
        // or reported an error or an expired challenge). Falls back to English.
        function altchaFailureMessage() {
            var messages = {
                en: "Verification failed. Please reload the page.",
                ru: "Проверка не удалась. Пожалуйста, обновите страницу.",
                uk: "Перевірка не пройдена. Будь ласка, перезавантажте сторінку.",
                es: "La verificación falló. Por favor, recargue la página.",
            };
            var langs = navigator.languages || [navigator.language || navigator.userLanguage || "en"];
            for (var i = 0; i < langs.length; i++) {
                var primary = (langs[i] || "").split("-")[0];
                if (messages[primary]) {
                    return messages[primary];
                }
            }
            return messages.en;
        }

        // Replace the perpetual spinner with a visible message and a manual reload link.
        // Deliberately no auto-reload: against a misconfigured server that keeps handing
        // out unsolvable challenges, auto-reload would spin forever and burn the client.
        function showAltChaFailure() {
            var msg = altchaFailureMessage();
            var loader = document.getElementsByClassName("loader")[0];
            if (loader) {
                loader.innerHTML = '<a href="#" onclick="location.reload(); return false;">' + msg + '</a>';
            }
            var footerTitle = document.getElementsByClassName("footer-title")[0];
            if (footerTitle) {
                footerTitle.textContent = msg;
            }
        }

        function getLocalizedMessage() {
            // Define messages for different locales
            var messages = {
                en: "Verifying if your connection is secure",
                ru: "Проверка безопасности вашего соединения",
                uk: "Перевірка безпеки вашого з’єднання",
                be: "Праверка бяспекі вашага злучэнння", // Belarusian version
                es: "Verificando que su conexión sea segura",
                zh: {
                    TW: "正在檢查您的連線是否安全", // Traditional Chinese
                    HK: "正在檢查您的連線是否安全", // Traditional Chinese
                    CN: "正在检查您的连接是否安全", // Simplified Chinese
                },
            };

            // Define priorities for locales
            var priorities = {
                en: 0,
                ru: 10,
                uk: 20,
                be: 15,
                es: 15,
                zh: {
                    TW: 10,
                    HK: 10,
                    CN: 5,
                },
            };

            // Get user's preferred languages
            var userLanguages = navigator.languages || [
                navigator.language || navigator.userLanguage,
            ];
            console.log('userLanguages', userLanguages);

            var highestPriority = -1;
            var selectedMessage = messages.en; // default message

            for (var lang of userLanguages) {
                var primaryLang = lang.split("-")[0];
                var locale = lang.split("-")[1];
                var priority = priorities[primaryLang];

                // handle lang with locale like zh-TW / zh-CN
                if (typeof priority == "object") {
                    // handle "zh" without unkown locale
                    if (locale == undefined) {
                        // not an Object.prototype helper: an enumerable prototype
                        // property leaks into for..in loops in the ALTCHA widget
                        locale = Object.keys(priorities[primaryLang])[0];
                    }
                    priority = priorities[primaryLang][locale]
                }

                // Check if the language exists in our messages and priorities
                if (messages[primaryLang] && priority > highestPriority) {
                    highestPriority = priority;
                    selectedMessage = messages[primaryLang];
                    if (typeof selectedMessage == "object") {
                        selectedMessage = selectedMessage[locale];
                    }
                }
            }

            return selectedMessage;
        }

        function getFavicon(imgElement) {
            // Build the base URL in a backward-compatible way
            var origin = window.location.protocol + "//" + window.location.host;
            var faviconUrl = origin + '/favicon.ico';
            var fallbackSvg = imgElement.src;
            var testImage = new Image();

            testImage.src = faviconUrl

            // Set favicon if it loads successfully
            testImage.addEventListener('load', function() {
                imgElement.src = faviconUrl;
            });

            // Fallback to SVG if favicon fails to load
            testImage.addEventListener('error', function() {
                console.log('Favicon not found, falling back to SVG');
                imgElement.src = fallbackSvg;
            });
        }

        function setDomainName() {
            document.getElementsByClassName("website-title")[0].textContent =
                window.location.hostname;
            document.getElementsByClassName("website-title-footer")[0].textContent =
                window.location.hostname;
        }

        function setTitle() {
            document.getElementsByClassName("footer-title")[0].textContent =
                getLocalizedMessage();
        }

        function setFavicon() {
            getFavicon(document.getElementsByClassName("website-favicon")[0])
        }

        (async () => {
            var payload = {};

            // navigator.webdriver
            payload.webdriver = 'webdriver' in navigator ? navigator.webdriver : false;

            // Plugins counts
            payload.hasPlugins = 'plugins' in navigator && navigator.plugins.length > 0;

            // WebGL GPU
            var canvas = document.createElement("canvas");
            var gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
            if (gl) {
                var debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
                payload.gpuRenderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "Unavailable";
            } else {
                payload.gpuRenderer = "Error";
            }

            // Hardware
            payload.cpu = 'hardwareConcurrency' in navigator ? navigator.hardwareConcurrency : 0;
            payload.memory = 'deviceMemory' in navigator ? navigator.deviceMemory : 0;

            // Screen vs window size
            payload.screen = {
                width: screen.width,
                height: screen.height,
            };
            payload.window = {
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
            };

            if ('mediaDevices' in navigator && navigator.mediaDevices.enumerateDevices) {
                navigator.mediaDevices.enumerateDevices().then(function (devices) {
                    var hasWebcam = devices.some(function (device) { return device.kind === "videoinput"; });
                    payload.webcam = hasWebcam;
                }).catch(function (error) {
                    payload.webcam = false;
                });
            } else {
                payload.webcam = false;
            }

            payload.colorDepth = window.screen.colorDepth;
            payload.langLength = 'languages' in navigator ? navigator.languages.length : 1;
            payload.language = navigator.language || '';
            payload.languages = navigator.languages || [];
            payload.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
            payload.platform = navigator.platform || '';
            payload.touchSupport = {
                touchEvent: 'ontouchstart' in window,
                maxTouchPoints: navigator.maxTouchPoints || 0
            };

            function hashString(str) {
                var hash = 5381;
                for (var i = 0; i < str.length; i++) {
                    hash = ((hash << 5) + hash) + str.charCodeAt(i);
                }
                return (hash >>> 0).toString(16);
            }

            function canvasFingerprintHash() {
                try {
                    var canvas = document.createElement('canvas');
                    var ctx = canvas.getContext('2d');
                    ctx.textBaseline = 'top';
                    ctx.font = '14px Arial';
                    ctx.fillStyle = '#f60';
                    ctx.fillRect(0, 0, 100, 100);
                    ctx.fillStyle = '#069';
                    ctx.fillText('Baskerville', 10, 50);
                    return hashString(canvas.toDataURL());
                } catch {
                    return "0";
                }
            }

            function webglFingerprintHash() {
                try {
                    var canvas = document.createElement('canvas');
                    var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    var debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    var vendor = debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : 'unknown';
                    var renderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 'unknown';
                    return hashString(`${vendor}~${renderer}`);
                } catch {
                    return "0";
                }
            }

            function mathPrecisionQuirkHash() {
                try {
                    var str = [
                        Math.acos(0.123),
                        Math.tan(0.5),
                        Math.log(42),
                        Math.sin(Math.PI / 3),
                    ].map(x => x.toPrecision(15)).join(',');
                    return hashString(str);
                } catch {
                    return "0";
                }
            }

            payload.canvasFp = canvasFingerprintHash();
            payload.webglFp = webglFingerprintHash();
            payload.mathFp = mathPrecisionQuirkHash();

            if (navigator.mediaDevices?.enumerateDevices) {
                try {
                    var devices = await navigator.mediaDevices.enumerateDevices();
                    payload.webcam = devices.some(d => d.kind === "videoinput");
                } catch {
                    payload.webcam = false;
                }
            }

            var dataString = JSON.stringify(payload);
            var encodedData = window.btoa ? btoa(dataString) : Base64.encode(dataString);
            document.cookie = "deflect_integrity=" + encodedData + ";SameSite=Lax;path=/;";
        })().catch(err => {
            console.error(err);
        });

    </script>
    <style>
        body,
        html {
            height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
                sans-serif;
            margin: 0;
        }
        a {
            color: #e33624;
            text-decoration: none;
        }
        h1,
        h2 {
            font-weight: 400;
        }
        .header {
            height: 33%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .header-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
            height: 100%;
        }
        .footer {
            height: 67%;
            display: flex;
            justify-content: center;
            background-color: #ecece2;
            padding: 0 15px;
        }
        .website {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        .website-favicon {
            width: 32px;
            margin-right: 15px;
        }
        .website-title {
            font-size: 32px;
        }
        .loader {
            margin: 15px;
        }
        .footer-wrapper {
            display: flex;
            justify-content: space-between;
            flex-direction: column;
            text-align: center;
            margin-bottom: 50px;
            margin-top: 15px;
        }
        .footer-title {
            font-size: 24px;
        }
        .footer-logo svg {
            width: 50px;
            height: 80px;
        }
        .footer-logo-caption {
            font-size: 18px;
        }
        @media screen and (min-width: 2400px) {
            .footer-logo svg {
                width: 2vw;
                height: 3vw;
            }
            .footer-logo-caption {
                font-size: 1vw;
            }
            .website-title {
                font-size: 2vw;
            }
            .website-favicon {
                width: 2vw;
            }
            .footer-title {
                font-size: 1.7vw;
            }
        }
    </style>
</head>

<body>
    <div class="header">
      <div class="header-wrapper">
        <div class="website">
          <img class="website-favicon" src="data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%2210%22%20stroke%3D%22%23333%22%20stroke-width%3D%221.5%22%20fill%3D%22%23cce5ff%22%2F%3E%3Cpath%20d%3D%22M12%202c3%202%205%205.5%205%2010s-2%208-5%2010c-3-2-5-5.5-5-10s2-8%205-10Z%22%20stroke%3D%22%23333%22%20stroke-width%3D%221%22%20fill%3D%22none%22%2F%3E%3Cpath%20d%3D%22M2%2012h20M12%202v20%22%20stroke%3D%22%23333%22%20stroke-width%3D%221%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E" onerror="this.style.display='none'"/>
          <span class="website-title"></span>
          <noscript>
            <h1 class="js-alert">Please turn on JavaScript and reload the page.</h1>
          </noscript>
        </div>
        <div class="loader">
          <!--
              XXX: http_server.go applyArgsToAltChaPage() replaces the empty challenge attribute
                   below with the per-request ALTCHA v2 challenge JSON {parameters, signature},
                   HTML-escaped. It replaces the first match only, so do not quote that attribute
                   anywhere above it.
              One-click checkbox: the proof of work only starts when the visitor ticks it
              (auto="off"), then the statechange handler below sets the cookie and reloads.
          -->
          <altcha-widget id="altcha" auto="off" type="checkbox" challenge="{}"
                         configuration='{"hideFooter": true, "hideLogo": true}'></altcha-widget>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="footer-wrapper">
        <h2 class="footer-title">Verifying if your connection is secure</h2>
        <figure class="footer-logo">
          <a href="https://deflect.ca/" target="_blank">
             <svg version="1.0" xmlns="http://www.w3.org/2000/svg" width="412.000000pt" height="468.000000pt" viewBox="0 0 412.000000 468.000000" preserveAspectRatio="xMidYMid meet" > <g transform="translate(0.000000,468.000000) scale(0.100000,-0.100000)" fill="#e33624" stroke="#e33624" > <path d="M1190 4486 c-459 -100 -915 -199 -1012 -221 l-178 -38 0 -946 c0 -559 4 -993 10 -1061 33 -373 184 -727 458 -1070 170 -214 457 -475 742 -674 271 -191 770 -461 849 -460 24 0 87 25 192 76 539 261 1020 615 1333 979 263 306 416 598 498 949 22 94 22 103 25 1151 l4 1057 -23 5 c-145 36 -2021 437 -2039 436 -13 -1 -400 -83 -859 -183z"/> </g> </svg>
          </a>
          <figcaption class="footer-logo-caption">
            <div>
              <span class="website-title-footer"></span> is protected by
              <a href="https://deflect.ca/" target="_blank">Deflect</a>
            </div>
          </figcaption>
        </figure>
      </div>
    </div>
    <script type="module">
        var widget = document.getElementById("altcha");
        widget.addEventListener("statechange", function (ev) {
            var state = ev.detail.state;
            if (state === "verified" && ev.detail.payload) {
                // base64 of {challenge, solution}, checked by VerifyAltChaPayload
                var base64_cookie = ev.detail.payload;
                // XXX: http_server.go applyCookieMaxAge() applies Max-Age dynamically to the
                //      next line by string-matching its cookie-name-plus-base64_cookie prefix,
                //      first match only: do NOT reformat it or quote it in a comment above. The
                //      trailing 'secure;' is appended only over HTTPS so the cookie still works
                //      on the plain-HTTP demo.
                document.cookie = "deflect_altcha=" + base64_cookie + ";SameSite=Lax;path=/;" + (location.protocol === "https:" ? "secure;" : "");
                location.reload();
            } else if (state === "error" || state === "expired") {
                showAltChaFailure();
            }
        });
    </script>
    <script>
        // the widget bundle failed to load (CDN blocked or down, or the integrity check
        // failed): nothing will ever solve the challenge, so say so instead of spinning
        window.addEventListener("load", function () {
            if (!window.customElements || !customElements.get("altcha-widget")) {
                showAltChaFailure();
            }
        });
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setDomainName();
            setFavicon();
            setTitle();
        });
    </script>
  </body>
</html>
